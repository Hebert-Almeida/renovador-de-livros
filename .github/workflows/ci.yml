name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential curl wget file pkg-config

      # O SQLCipher vendorizado (OpenSSL) precisa do Strawberry Perl antes do perl do Git.
      - name: Strawberry Perl no PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\Strawberry\perl\bin" >> "$GITHUB_PATH"

      # rust-toolchain.toml define canal, componentes e targets.
      - name: Toolchain Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # O build do src-tauri exige ../build (frontendDist).
      - name: npm run build
        run: npm run build

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No Windows, src-tauri/build.rs embute o manifesto também nos testes.
      - name: cargo test
        run: cargo test --workspace

      - name: npm run check
        run: npm run check

      - name: vitest
        run: npm test

  android:
    name: android debug
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # O runner ubuntu já traz Android SDK e NDK pré-instalados.
      # O NDK r23+ não traz mais as binutils (<triplo>-ranlib/-ar): o OpenSSL
      # vendorizado usa as ferramentas LLVM do próprio NDK.
      - name: NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "RANLIB=$bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "AR=$bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Toolchain Rust (targets Android)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # aarch64 (aparelhos) e x86_64 (emulador); armv7 e i686 só no release.
      - name: Build Android debug
        run: npx tauri android build --debug --apk --target aarch64 --target x86_64
      - name: Testes JVM do plugin
        working-directory: src-tauri/gen/android
        run: ./gradlew --no-daemon :tauri-plugin-renovador-bg:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories

  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Só dependências de produção, falhando a partir de "high".
      # Licenças npm: GSAP usa a "Standard No Charge License" (não OSI) — exceção aceita,
      # documentada em docs/PLANO-V2.md; por isso não há checagem automática de licença no npm.
      - run: npm audit --omit=dev --audit-level=high

  notices:
    name: avisos de terceiros
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
      - name: cargo-about
        run: cargo about --version 2>/dev/null | grep -qx 'cargo-about 0.9.3' || cargo install cargo-about --locked --version 0.9.3 --features cli
      - name: cargo fetch
        run: cargo fetch --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Mudou Cargo.lock ou package-lock.json? Rode `node scripts/gen-notices.mjs` e commite.
      - name: THIRD-PARTY-NOTICES.md e licenças da tela Sobre atualizados
        run: node scripts/gen-notices.mjs --check

  telas:
    name: telas (Playwright + axe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium do Playwright
        run: npx playwright install --with-deps chromium
      # Cada tela com IPC mockado: axe nos três temas, fluxos só por teclado e alvos de 44 px;
      # depois as rotas (axe) e o orçamento de JS inicial (≤ 150 KB gz, Three sob demanda).
      # Retentativas só absorvem a recarga do Vite (dev) na primeira visita; ficam marcadas como "flaky".
      - name: Suítes de tela, rotas e orçamento de JS
        run: node scripts/test-telas.mjs --retries=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-falhas
          path: |
            test-results/
            tests/ui/*/test-results/
          retention-days: 7
