name: Release

# Só disparo manual. O environment `publicacao` deve ter revisores obrigatórios
# configurados no GitHub (gate jurídico) antes de qualquer publicação.
# Gera uma release em RASCUNHO com os instaladores de todas as plataformas;
# publicar continua sendo um passo manual (docs/guia-de-manutencao.md, seção 4).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Recusa a release se os avisos de terceiros não correspondem aos lockfiles.
  notices:
    name: pré-checagens
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
      - name: cargo-about
        run: cargo about --version 2>/dev/null | grep -qx 'cargo-about 0.9.3' || cargo install cargo-about --locked --version 0.9.3 --features cli
      # O cargo-about roda offline: baixa antes os crates de todos os alvos.
      - name: cargo fetch
        run: cargo fetch --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: THIRD-PARTY-NOTICES.md e licenças da tela Sobre atualizados
        run: node scripts/gen-notices.mjs --check
      # O MSI exige versão numérica: bundle.windows.wix.version acompanha a versão do app.
      - name: Versão do MSI
        run: |
          node -e '
            const c = require("./src-tauri/tauri.conf.json");
            const app = c.version.split("-")[0];
            const msi = (c.bundle.windows.wix.version ?? "").split(".").slice(0, 3).join(".");
            if (app !== msi) { console.error(`wix.version ${msi} difere da versão ${c.version}`); process.exit(1); }
          '

  desktop:
    name: release (${{ matrix.platform }})
    needs: notices
    environment: publicacao
    strategy:
      fail-fast: false
      matrix:
        include:
          # AppImage, deb e rpm
          - platform: ubuntu-24.04
            args: ""
          # NSIS e MSI
          - platform: windows-latest
            args: ""
          # .app e dmg universal (Intel + Apple Silicon), sem assinatura Apple
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf rpm
      - name: Strawberry Perl no PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\Strawberry\perl\bin" >> "$GITHUB_PATH"
      - name: Toolchain Rust
        run: rustup show
      - name: Targets macOS
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Renovador de Livros v__VERSION__
          releaseBody: Release em rascunho — revisar antes de publicar.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
      # Orçamento da seção 5.7: instalador desktop ≤ 15 MB. O AppImage fica de fora:
      # ele embute o WebKitGTK e as bibliotecas do sistema por definição.
      - name: Tamanho dos instaladores
        shell: bash
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          node -e '
            const fs = require("fs");
            const LIMITE = 15 * 1024 * 1024;
            const paths = JSON.parse(process.env.ARTIFACTS || "[]")
              .filter((p) => /\.(exe|msi|dmg|deb|rpm)$/.test(p) && fs.existsSync(p));
            let ruim = 0;
            for (const p of paths) {
              const mb = fs.statSync(p).size / 1024 / 1024;
              console.log(`${mb.toFixed(2)} MB  ${p}`);
              if (mb * 1024 * 1024 > LIMITE) { ruim++; console.error(`::error::${p} passa de 15 MB`); }
            }
            if (!paths.length) { console.error("::error::nenhum instalador encontrado"); process.exit(1); }
            process.exit(ruim ? 1 : 0);
          '

  android:
    name: release (android)
    # Depois do desktop, para anexar o APK/AAB à release em rascunho que ele cria.
    # Roda mesmo se alguma plataforma desktop falhar (fail-fast: false); só as
    # pré-checagens são obrigatórias.
    needs: [notices, desktop]
    if: ${{ !cancelled() && needs.notices.result == 'success' }}
    environment: publicacao
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "RANLIB=$bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "AR=$bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Toolchain Rust (targets Android)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A keystore da Editora fica só nos secrets do environment `publicacao`.
      - name: Keystore de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Faltam os secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD no environment publicacao."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # O Gradle lê o arquivo com java.util.Properties: "\" é escape e precisa dobrar.
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=$(esc "$RUNNER_TEMP/release.jks")"
            echo "keyAlias=$(esc "$ANDROID_KEY_ALIAS")"
            echo "password=$(esc "$ANDROID_KEY_PASSWORD")"
          } > src-tauri/gen/android/keystore.properties
      - name: Build Android release (APK e AAB)
        run: npx tauri android build --apk --aab
      - name: Anexar à release em rascunho
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          out=src-tauri/gen/android/app/build/outputs
          mkdir -p dist-android
          cp "$out/apk/universal/release/app-universal-release.apk" "dist-android/renovador-de-livros_${version}_android.apk"
          cp "$out/bundle/universalRelease/app-universal-release.aab" "dist-android/renovador-de-livros_${version}_android.aab"
          (cd dist-android && sha256sum * > SHA256SUMS-android.txt)
          # Se nenhum job desktop chegou a criar a release, cria o rascunho aqui.
          gh release view "v${version}" >/dev/null 2>&1 || gh release create "v${version}"             --draft --prerelease --target "$GITHUB_SHA"             --title "Renovador de Livros v${version}" --notes "Release em rascunho — revisar antes de publicar."
          gh release upload "v${version}" dist-android/* --clobber
      - name: Apagar a keystore do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" src-tauri/gen/android/keystore.properties
