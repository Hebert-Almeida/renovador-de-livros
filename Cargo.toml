[workspace]
resolver = "3"
members = ["src-tauri", "crates/renovador-core", "plugins/tauri-plugin-renovador-bg"]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Hebert Almeida"]
repository = "https://github.com/Hebert-Almeida/renovador-de-livros"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
