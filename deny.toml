# Configuração do cargo-deny (licenças, fontes, advisories, duplicatas).
[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Só avisos "unmaintained" de dependências diretas falham (transitivas do Tauri/zbus fogem do nosso controle).
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "OpenSSL",
]

# SQLCipher vendorizado: SQLite (blessing, domínio público) e trechos WTFPL; ambas permissivas.
[[licenses.exceptions]]
crate = "sqlcipher-src"
allow = ["blessing", "WTFPL"]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
