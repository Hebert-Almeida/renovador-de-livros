[package]
name = "renovador-core"
description = "Núcleo do Renovador de Livros: motor Sophia, limites anti-abuso, banco criptografado e planejador"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
ed25519-dalek = "3.0.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "cookies", "gzip", "http2"] }
rusqlite = { version = "0.42.0", features = ["bundled-sqlcipher-vendored-openssl"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.28", features = ["derive", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1.44"
url = "2.5.8"
zeroize = { version = "1.9.1", features = ["derive"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "4.2.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6.5"
