[package]
name = "renovador"
description = "Renovador de Livros — app Tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "renovador"
path = "src/main.rs"

# Ferramenta de desenvolvimento: como `example`, não entra nos instaladores
# (o bundler do Tauri empacota todo `[[bin]]` do pacote).
[[example]]
name = "export-bindings"
path = "examples/export-bindings.rs"

[lib]
name = "renovador_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
renovador-core = { path = "../crates/renovador-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.28", features = ["derive", "chrono"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta-typescript = "0.0.15"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-renovador-bg = { path = "../plugins/tauri-plugin-renovador-bg" }
