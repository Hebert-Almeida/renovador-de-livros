# Configuração do cargo-about (THIRD-PARTY-NOTICES.md). Gerado por scripts/gen-notices.mjs.
# Mesmas licenças aceitas no deny.toml; só dependências que vão no binário.
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "blessing",
  "WTFPL",
]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "i686-linux-android",
  "x86_64-linux-android",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
